const countWords = (text) => text.trim().split(/\s+/).filter(Boolean).length;
const today = () => new Date().toISOString().slice(0, 10);

// Finds the school and department for a course name.
const findCourseHome = (course) => {
  for (const school of Object.keys(COURSE_DATA)) {
    for (const dept of Object.keys(COURSE_DATA[school])) {
      if (COURSE_DATA[school][dept].includes(course)) return { school, dept };
    }
  }
  return { school: "", dept: "" };
};

// Course abbreviation: first word's first 3 letters plus initials/numbers of the rest.
// "Algebra 1" -> ALG1, "Biology" -> BIO, "Pre-Calculus" -> PREC, "Algebra 1 (Honors)" -> ALG1H
const courseAbbreviation = (course) => {
  const words = course.replace(/[()&:–\/]/g, " ").split(/[\s-]+/).filter(Boolean);
  if (!words.length) return "STD";
  const first = words[0].replace(/[^A-Za-z0-9]/g, "").slice(0, 3);
  const rest = words.slice(1).map(w => /^\d+$/.test(w) ? w : w[0]).join("");
  return (first + rest).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
};

// Next unused ID for a course, checking every existing standard.
const nextStandardId = (course, standards) => {
  const prefix = courseAbbreviation(course);
  const used = new Set(Object.values(standards).flat().map(s => s.id));
  let n = 1;
  while (used.has(`${prefix}-${String(n).padStart(3, "0")}`)) n++;
  return `${prefix}-${String(n).padStart(3, "0")}`;
};

const matchesStatus = (s, filter, currentUser) => {
  if (filter === "approved") return s.status === "approved";
  if (filter === "drafts") return s.status === "draft";
  if (filter === "myDrafts") return s.status === "draft" && s.createdBy === currentUser;
  if (filter === "pendingApproval") return s.status === "draft" && s.submitted;
  return true;
};

const matchesQuery = (s, course, query) => {
  const haystack = `${s.id} ${s.category} ${s.description} ${course}`.toLowerCase();
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(word => haystack.includes(word));
};

const RigorTag = ({ placement }) => {
  if (!placement) return <span className="px-3 py-1 rounded-full text-xs font-medium border bg-gray-50 text-gray-500 border-gray-200">Rigor not analyzed</span>;
  return (
    <span className="px-3 py-1 rounded-full text-xs font-medium border bg-indigo-50 text-indigo-800 border-indigo-200">
      {COMPLEXITY_LEVELS[placement.complexity]}, {AUTONOMY_LEVELS[placement.autonomy]} autonomy
    </span>
  );
};

// The rigor scale grid. Rows run Retrieval (bottom) to Knowledge Utilization (top);
// columns run Low to High autonomy. The dot sits in the center of its cell.
const RigorGrid = ({ placement, compact = false }) => {
  const W = 520, H = compact ? 220 : 300, left = 150, top = 14, right = 14, bottom = 48;
  const cw = (W - left - right) / 4, ch = (H - top - bottom) / 4;
  const cx = placement ? left + cw * (placement.autonomy + 0.5) : 0;
  const cy = placement ? top + ch * (3 - placement.complexity + 0.5) : 0;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-xl" role="img"
      aria-label={placement ? `Rigor placement: ${COMPLEXITY_LEVELS[placement.complexity]} complexity, ${AUTONOMY_LEVELS[placement.autonomy]} autonomy` : "Rigor scale grid"}>
      {/* "Rigor" zone: high complexity, high autonomy */}
      <rect x={left + cw * 2} y={top} width={cw * 2} height={ch * 2} fill="#dbeafe" />
      <text x={left + cw * 4 - 6} y={top + 14} textAnchor="end" fontSize="11" fill="#1e40af">Rigor</text>
      {[0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => (
        <rect key={`${r}-${c}`} x={left + cw * c} y={top + ch * r} width={cw} height={ch} fill="none" stroke="#e5e7eb" />
      )))}
      <rect x={left} y={top} width={cw * 4} height={ch * 4} fill="none" stroke="#9ca3af" />
      {COMPLEXITY_LEVELS.map((label, i) => (
        <text key={label} x={left - 8} y={top + ch * (3 - i + 0.5) + 4} textAnchor="end" fontSize="12" fill="#4b5563">{label}</text>
      ))}
      {AUTONOMY_LEVELS.map((label, i) => (
        <text key={label} x={left + cw * (i + 0.5)} y={top + ch * 4 + 18} textAnchor="middle" fontSize="12" fill="#4b5563">{label}</text>
      ))}
      <text x={left + cw * 2} y={H - 6} textAnchor="middle" fontSize="12" fontWeight="600" fill="#374151">Autonomy</text>
      {placement && (
        <g>
          <circle cx={cx} cy={cy} r="9" fill="#4f46e5" stroke="white" strokeWidth="2" />
          <text x={cx} y={cy - 14} textAnchor="middle" fontSize="11" fontWeight="700" fill="#4f46e5">AI</text>
        </g>
      )}
    </svg>
  );
};

const BrowseView = ({ standards, userRole, currentUser, onApprove, onReject, flash }) => {
  const [school, setSchool] = useState("");
  const [dept, setDept] = useState("");
  const [course, setCourse] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [scope, setScope] = useState("course");
  const [expanded, setExpanded] = useState({});
  const [showWestminster, setShowWestminster] = useState(false);
  const [showDepartment, setShowDepartment] = useState(false);

  const searching = query.trim().length >= 2;
  const searchAll = searching && (!course || scope === "all");

  // Each result is { course, standard }.
  const results = useMemo(() => {
    const courses = searchAll ? Object.keys(standards) : (course ? [course] : []);
    return courses.flatMap(c => (standards[c] || [])
      .filter(s => matchesStatus(s, statusFilter, currentUser))
      .filter(s => !searching || matchesQuery(s, c, query))
      .map(s => ({ course: c, standard: s })));
  }, [standards, course, statusFilter, currentUser, query, searching, searchAll]);

  const toggle = (id) => setExpanded(prev => ({ ...prev, [id]: !prev[id] }));

  return (
    <div className="space-y-6">
      {flash && <Notice tone="success">{flash}</Notice>}
      <FilterPills statusFilter={statusFilter} setStatusFilter={setStatusFilter} userRole={userRole} />
      <SchoolDeptCourse school={school} dept={dept} course={course}
        onSchool={(v) => { setSchool(v); setDept(""); setCourse(""); }}
        onDept={(v) => { setDept(v); setCourse(""); }}
        onCourse={setCourse} />
      <SearchBar query={query} setQuery={setQuery} scope={scope} setScope={setScope} courseSelected={!!course} course={course} />

      {dept && !searchAll && (
        <PortraitPanels dept={dept} showWestminster={showWestminster} setShowWestminster={setShowWestminster}
          showDepartment={showDepartment} setShowDepartment={setShowDepartment} />
      )}

      {searchAll && (
        <p className="text-sm text-gray-600">{results.length} {results.length === 1 ? "standard" : "standards"} across all courses match “{query.trim()}”.</p>
      )}

      {results.length > 0 && (
        <div className="space-y-3">
          {results.map(({ course: c, standard }) => (
            <StandardCard key={standard.id} standard={standard} course={c} expanded={!!expanded[standard.id]}
              onToggle={() => toggle(standard.id)} userRole={userRole} onApprove={onApprove} onReject={onReject}
              showPath={searchAll} />
          ))}
        </div>
      )}

      {results.length === 0 && (searching || course) && (
        <EmptyState title={searching ? "No standards match that search." : "No standards found with the current filters."}
          detail={searching ? "Try a shorter word, or switch the filter to All Standards." : "Try All Standards, or pick another course."} />
      )}
      {!course && !searching && (
        <EmptyState title="Select a school, department, and course to view standards."
          detail="Or search above to find standards across every course." />
      )}
    </div>
  );
};

const EMPTY_FORM = { school: "", department: "", course: "", category: "", description: "" };

const CreateStandardView = ({ standards, currentUser, onSave }) => {
  const [form, setForm] = useState(EMPTY_FORM);
  const [selectedPOGs, setSelectedPOGs] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [showBank, setShowBank] = useState(false);
  const [message, setMessage] = useState(null); // { tone, text }

  const set = (patch) => setForm(prev => ({ ...prev, ...patch }));
  const words = countWords(form.description);
  const deptStandards = form.department && DEPARTMENT_PORTRAITS[form.department] ? DEPARTMENT_PORTRAITS[form.department].standards : [];
  const standardId = form.course ? nextStandardId(form.course, standards) : "";

  const analyze = async () => {
    if (countWords(form.description) < 4) {
      setMessage({ tone: "error", text: "Write the full standard description before analyzing it." });
      return;
    }
    if (WORKER_URL.includes("YOUR-SUBDOMAIN")) {
      setMessage({ tone: "error", text: "AI analysis isn't connected yet. Add the Worker address to WORKER_URL in index.html." });
      return;
    }
    setMessage(null);
    setAnalyzing(true);
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description: form.description, course: form.course, department: form.department, school: form.school })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      setAnalysis(data);
    } catch (err) {
      console.error(err);
      setMessage({ tone: "error", text: `The AI analysis didn't finish: ${err.message}. Try again in a moment.` });
    } finally {
      setAnalyzing(false);
    }
  };

  const save = (submit) => {
    const problems = [];
    if (!form.school || !form.department || !form.course) problems.push("choose a school, department, and course");
    if (!form.category.trim()) problems.push("add a category");
    if (!form.description.trim()) problems.push("write a description");
    else if (!form.description.trim().toLowerCase().startsWith("students will")) problems.push("start the description with “Students will...”");
    if (selectedPOGs.length < 1) problems.push("select at least one Department Portrait statement");
    if (problems.length) {
      setMessage({ tone: "error", text: `Before saving, ${problems.join(", ")}.` });
      return;
    }
    onSave(form.course, {
      id: standardId,
      category: form.category.trim(),
      description: form.description.trim(),
      rigorPlacement: analysis ? { complexity: analysis.complexity, autonomy: analysis.autonomy } : null,
      status: "draft",
      submitted: submit,
      createdBy: currentUser,
      createdDate: today(),
      alignsTo: selectedPOGs,
      assessments: analysis ? analysis.assessments : []
    });
    setMessage({ tone: "success", text: submit
      ? `${standardId} was submitted for approval. In this demo it appears in Browse until you reload the page.`
      : `${standardId} was saved as a draft. In this demo it appears in Browse until you reload the page.` });
    setForm(EMPTY_FORM);
    setSelectedPOGs([]);
    setAnalysis(null);
  };

  const togglePOG = (code) => setSelectedPOGs(prev =>
    prev.includes(code) ? prev.filter(c => c !== code) : prev.length < 3 ? [...prev, code] : prev);

  return (
    <div className="max-w-4xl mx-auto">
      <div className="bg-white rounded-lg shadow-lg p-6 md:p-8">
        <div className="flex items-center justify-between gap-4 mb-6 flex-wrap">
          <h2 className="text-2xl font-bold text-gray-800">Create New Standard</h2>
          <button onClick={() => setShowBank(true)} className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center gap-2">
            <DatabaseIcon />Pull from Bank
          </button>
        </div>

        {message && <div className="mb-6"><Notice tone={message.tone}>{message.text}</Notice></div>}

        <div className="space-y-6">
          <SchoolDeptCourse showLabels school={form.school} dept={form.department} course={form.course}
            onSchool={(v) => { set({ school: v, department: "", course: "" }); setSelectedPOGs([]); }}
            onDept={(v) => { set({ department: v, course: "" }); setSelectedPOGs([]); }}
            onCourse={(v) => set({ course: v })} />

          {form.course && (
            <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-800">
              <strong>Standard ID (auto-generated):</strong> {standardId}
            </div>
          )}

          <div>
            <label htmlFor="category" className="block text-sm font-medium text-gray-700 mb-2">
              Category * <span className="text-gray-500 text-xs">({form.category.length}/30 characters)</span>
            </label>
            <input id="category" type="text" value={form.category} maxLength={30} onChange={(e) => set({ category: e.target.value })}
              placeholder="e.g., Linear Equations" className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>

          <div>
            <label htmlFor="description" className="block text-sm font-medium text-gray-700 mb-2">
              Description * <span className={`text-xs ${words > 25 ? "text-orange-600" : "text-gray-500"}`}>({words} words, target about 20)</span>
            </label>
            <textarea id="description" value={form.description} rows={4} placeholder="Students will..."
              onChange={(e) => { set({ description: e.target.value }); setAnalysis(null); }}
              className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
            <p className="text-xs text-gray-500 mt-1">Must start with “Students will...”</p>
          </div>

          <div>
            <button onClick={analyze} disabled={analyzing || !form.description.trim()}
              className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2">
              <SparklesIcon className="w-5 h-5" />{analyzing ? "Analyzing..." : "Analyze Standard with AI"}
            </button>
          </div>

          {analysis && <RigorAnalysisPanel analysis={analysis} />}

          {deptStandards.length > 0 && (
            <fieldset>
              <legend className="block text-sm font-medium text-gray-700 mb-3">
                Aligns to Department Portrait * <span className="text-gray-500 text-xs">(Select 1-3)</span>
              </legend>
              <div className="space-y-2 max-h-72 overflow-y-auto p-4 bg-gray-50 rounded-lg border border-gray-200">
                {deptStandards.map(std => {
                  const checked = selectedPOGs.includes(std.code);
                  return (
                    <label key={std.code} className={`flex items-start gap-3 p-3 rounded-lg cursor-pointer transition-colors ${checked ? "bg-purple-100 border-2 border-purple-500" : "bg-white border-2 border-transparent hover:bg-gray-50"}`}>
                      <input type="checkbox" checked={checked} onChange={() => togglePOG(std.code)}
                        disabled={!checked && selectedPOGs.length >= 3} className="mt-1" />
                      <div className="flex-1">
                        <div className="font-semibold text-gray-800">{std.code}</div>
                        <div className="text-sm text-gray-600">{std.description}</div>
                      </div>
                    </label>
                  );
                })}
              </div>
              <p className="text-xs text-gray-500 mt-2">{selectedPOGs.length}/3 selected</p>
            </fieldset>
          )}

          <div className="flex flex-col sm:flex-row gap-4 pt-4 border-t">
            <button onClick={() => save(false)} className="flex-1 px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 font-semibold">Save as Draft</button>
            <button onClick={() => save(true)} className="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">Submit for Approval</button>
          </div>
        </div>
      </div>

      {showBank && <BankModal onClose={() => setShowBank(false)}
        onPick={(text) => { set({ description: text }); setAnalysis(null); setShowBank(false); }} />}
    </div>
  );
};

/* =====================================================================
   COURSE OUTLINES (next build)
   ===================================================================== */
const OutlineView = () => (
  <div className="bg-white rounded-lg shadow-md p-6">
    <h2 className="text-2xl font-bold text-gray-800 mb-4">Course Outline Builder</h2>
    <p className="text-gray-600">The Course Outline interface will be built in the next iteration.</p>
  </div>
);

/* =====================================================================
   PAGE FRAME
   ===================================================================== */
const ROLES = [
  { key: "teacher", label: "Teacher" },
  { key: "chair", label: "Department Chair" },
  { key: "principal", label: "Principal" },
  { key: "superadmin", label: "SuperAdmin" }
];
const ROLE_LABEL = Object.fromEntries(ROLES.map(r => [r.key, r.label]));

const Header = ({ currentUser, userRole }) => (
  <header className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg">
    <div className="container mx-auto px-4 py-6 flex items-center justify-between gap-4 flex-wrap">
      <div>
        <h1 className="text-2xl md:text-3xl font-bold">Westminster Standards Platform</h1>
        <p className="text-blue-100 mt-1">Building academic excellence through clear, rigorous standards</p>
        <p className="text-blue-200 text-sm mt-1">Phase 1 Prototype – For Review and Feedback</p>
      </div>
      <div className="flex items-center gap-2">
        <UsersIcon className="w-5 h-5" />
        <div className="text-right">
          <div className="text-sm font-medium">{currentUser}</div>
          <div className="text-xs text-blue-200">{ROLE_LABEL[userRole]}</div>
        </div>
      </div>
    </div>
  </header>
);

const RoleBar = ({ userRole, setUserRole }) => (
  <div className="bg-yellow-50 border-b border-yellow-200">
    <div className="container mx-auto px-4 py-2 flex items-center gap-4 text-sm flex-wrap">
      <span className="text-yellow-800 font-medium">Demo mode. Select a role:</span>
      {ROLES.map(r => (
        <label key={r.key} className="flex items-center gap-2">
          <input type="radio" name="role" checked={userRole === r.key} onChange={() => setUserRole(r.key)} />{r.label}
        </label>
      ))}
      <span className="text-yellow-700 text-xs">Sample data. Changes reset when you reload.</span>
    </div>
  </div>
);

const TABS = [
  { key: "browse", label: "Browse Standards", Icon: BookOpen },
  { key: "create", label: "Create Standard", Icon: PlusIcon },
  { key: "outline", label: "Course Outlines", Icon: TargetIcon }
];

const NavTabs = ({ view, setView }) => (
  <nav className="bg-white shadow-md">
    <div className="container mx-auto px-4 flex gap-6 overflow-x-auto">
      {TABS.map(({ key, label, Icon }) => (
        <button key={key} onClick={() => setView(key)} aria-current={view === key ? "page" : undefined}
          className={`py-4 px-2 border-b-2 font-medium transition-colors flex items-center gap-2 whitespace-nowrap ${view === key ? "border-blue-600 text-blue-600" : "border-transparent text-gray-600 hover:text-gray-800"}`}>
          <Icon />{label}
        </button>
      ))}
    </div>
  </nav>
);

const App = () => {
  const [view, setView] = useState("browse");
  const [userRole, setUserRole] = useState("teacher");
  const [standards, setStandards] = useState(SAMPLE_STANDARDS);
  const [flash, setFlash] = useState("");
  const currentUser = DEMO_USER;

  const updateStandard = (course, id, change) => setStandards(prev => ({
    ...prev,
    [course]: change === null ? prev[course].filter(s => s.id !== id) : prev[course].map(s => s.id === id ? { ...s, ...change } : s)
  }));
  const approve = (course, id) => { updateStandard(course, id, { status: "approved" }); setFlash(`${id} was approved.`); };
  const reject = (course, id) => { updateStandard(course, id, null); setFlash(`${id} was rejected and your comments were sent to its author (in the full version, by email).`); };
  const addStandard = (course, standard) => setStandards(prev => ({ ...prev, [course]: [...(prev[course] || []), standard] }));

  return (
    <div className="min-h-screen bg-gray-50">
      <Header currentUser={currentUser} userRole={userRole} />
      <RoleBar userRole={userRole} setUserRole={setUserRole} />
      <NavTabs view={view} setView={(v) => { setView(v); setFlash(""); }} />
      <main className="container mx-auto px-4 py-8">
        {view === "browse" && <BrowseView standards={standards} userRole={userRole} currentUser={currentUser}
          onApprove={approve} onReject={reject} flash={flash} />}
        {view === "create" && <CreateStandardView standards={standards} currentUser={currentUser} onSave={addStandard} />}
        {view === "outline" && <OutlineView />}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
