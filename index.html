function addCourse(school, department, name, o) {
  const opts = o || {};
  COURSES.push({
    school: school,
    department: department,
    name: name,
    grades: opts.grades || [],
    core: opts.core === undefined ? null : opts.core,
    family: opts.family || null,
    level: opts.level || null,
    byLevel: !!opts.byLevel,
    verified: opts.verified !== false
  });
}
function addMiddle(department, names) {
  names.forEach(function (n) { addCourse(MS, department, n); });
}
function us(department, name, grades, o) {
  addCourse(US, department, name, Object.assign({ grades: grades }, o || {}));
}
function usUnverified(department, names) {
  names.forEach(function (n) { addCourse(US, department, n, { verified: false }); });
}

      grades: entry[1],

      family: base,
      level: entry[0]

  });
}

const courseKey = function (school, department, course) { return school + "|" + department + "|" + course; };
const CORE_BY_KEY = {};

function findCourse(school, department, name) {
  return COURSES.find(function (c) { return c.school === school && c.department === department && c.name === name; }) || null;
}

function gradeText(c) {
  if (!c) return "";
  if (c.byLevel) return "Placed by language level, not by grade";
  if (c.school === MS) return "Grade not set";
  if (!c.verified) return "Grade not set (not on the 2026-27 registration forms)";
  const g = c.grades;
  if (g.length === 0) return "Grade not set";
  if (g.length === 1) return "Grade " + g[0];
  const consecutive = g.every(function (v, i) { return i === 0 || v === g[i - 1] + 1; });
  return "Grades " + (consecutive ? g[0] + "–" + g[g.length - 1] : g.join(", "));
}

// Department statements line up with the Westminster statements by number.

// so they have no automatic connection until a chair sets one.
function westminsterCode(deptCode) {
  const m = deptCode.match(/^([A-Z]+)-POG-(\d+)$/);
  if (!m) return null;
  if (m[1] === "ENG" || m[1] === "ART") return null;
  const n = parseInt(m[2], 10);
  return n >= 1 && n <= 7 ? "WCA-POG-" + n : null;
}

const matchesCourse = function (s, c) {

const STOP_WORDS = ["of", "and", "the", "to", "a", "an", "in", "for"];

// Builds IDs like ALG1-004 from the course name and checks existing IDs for uniqueness.
// "(Honors)" and other parenthetical notes are ignored so levels of a course share a prefix.
function generateStandardId(courseName, existingIds) {
  if (!courseName) return "";
  const cleaned = courseName.replace(/\(.*?\)/g, " ").replace(/&/g, " ");
  const tokens = cleaned.split(/[\s\-\/:–,]+/).filter(Boolean)
    .filter(t => !STOP_WORDS.includes(t.toLowerCase()));
  const alpha = tokens.filter(t => /^[A-Za-z]+$/.test(t) && !/^(I|II|III|IV|V)$/i.test(t));
  const nums = tokens.filter(t => /^\d+$/.test(t) || /^(I|II|III|IV|V)$/i.test(t));
  const letters = alpha.slice(0, 2).map(t => t.slice(0, 3).toUpperCase()).join("");
  const prefix = (letters + nums.slice(0, 1).join("")).toUpperCase() || "STD";
  let max = 0;
  existingIds.forEach(id => {
    const m = id.match(/^(.+)-(\d+)$/);
    if (m && m[1] === prefix) max = Math.max(max, parseInt(m[2], 10));
  });
  return prefix + "-" + String(max + 1).padStart(3, "0");
}

const countWords = (text) => text.trim().split(/\s+/).filter(Boolean).length;

function rigorBadgeClass(p) {
  const sum = p.complexity + p.autonomy;
  if (sum <= 1) return "bg-green-100 text-green-800 border-green-300";
  if (sum <= 3) return "bg-blue-100 text-blue-800 border-blue-300";
  if (sum <= 4) return "bg-yellow-100 text-yellow-800 border-yellow-300";
  if (sum <= 5) return "bg-orange-100 text-orange-800 border-orange-300";
  return "bg-red-100 text-red-800 border-red-300";
}

  const results = useMemo(() => {
    const passesStatus = (s) => {
      if (statusFilter === "approved") return s.status === "approved";
      if (statusFilter === "drafts") return s.status === "draft";
      if (statusFilter === "myDrafts") return s.status === "draft" && s.createdBy === currentUser;
      if (statusFilter === "pendingApproval") return s.status === "draft" && s.submitted && canReviewDept(s.department);
      return true;
    };
    const passesSearch = (s) => !term ||
      s.description.toLowerCase().includes(term) ||
      s.category.toLowerCase().includes(term) ||
      s.id.toLowerCase().includes(term) ||
      s.course.toLowerCase().includes(term);

    if (course) {
      return standards.filter(s => s.school === school && s.department === department && s.course === course && passesStatus(s) && passesSearch(s));
    }
    if (term) return standards.filter(s => passesStatus(s) && passesSearch(s));
    return [];
  }, [standards, school, department, course, term, statusFilter, currentUser, userRole, chairDepartment]);

  const westminsterPortrait = WESTMINSTER_PORTRAIT;
  const deptPortrait = DEPARTMENT_PORTRAITS[department];
  const courses = (school && department && COURSE_DATA[school][department]) || [];
  const globalSearch = !course && term;

  return (
    <div className="space-y-6">
      <div className="flex flex-wrap gap-2">
        <FilterPill active={statusFilter === "all"} onClick={() => setStatusFilter("all")}>All Standards</FilterPill>
        <FilterPill active={statusFilter === "approved"} onClick={() => setStatusFilter("approved")}>Approved Only</FilterPill>
        <FilterPill active={statusFilter === "drafts"} onClick={() => setStatusFilter("drafts")}>All Drafts</FilterPill>
        <FilterPill active={statusFilter === "myDrafts"} onClick={() => setStatusFilter("myDrafts")}>My Drafts</FilterPill>
        {isReviewer && (
          <FilterPill active={statusFilter === "pendingApproval"} onClick={() => setStatusFilter("pendingApproval")}>Pending My Approval</FilterPill>
        )}
      </div>

      <p className="text-sm text-gray-500">
        Click any standard to see how it aligns to the portrait. Yellow DRAFT cards are still waiting for approval.
        To write a new one, use Create Standard.
      </p>

      <div className="relative">
        <Icon name="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5 pointer-events-none" />
        <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
          aria-label="Search standards"
          placeholder={course ? "Search standards in this course..." : "Search all standards across all courses (try “factoring”)..."}
          className="w-full pl-10 pr-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        <select value={school} aria-label="School"
          onChange={e => { setSchool(e.target.value); setDepartment(""); setCourse(""); }}
          className="px-4 py-2 border border-gray-300 rounded-lg">
          <option value="">Select School</option>
          {Object.keys(COURSE_DATA).map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={department} aria-label="Department" disabled={!school}
          onChange={e => { setDepartment(e.target.value); setCourse(""); setShowDepartment(false); }}
          className="px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
          <option value="">Select Department</option>
          {school && Object.keys(COURSE_DATA[school]).map(d => <option key={d} value={d}>{d}</option>)}
        </select>
        <select value={course} aria-label="Course" disabled={!department || courses.length === 0}
          onChange={e => setCourse(e.target.value)}
          className="px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
          <option value="">{department && courses.length === 0 ? "No courses listed" : "Select Course"}</option>
          {courses.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      {department && (
        <div className="space-y-4">
          <PortraitBox tone="blue" icon="award" title={westminsterPortrait.title} tagline={westminsterPortrait.tagline}
            statements={westminsterPortrait.traits} open={showWestminster} onToggle={() => setShowWestminster(!showWestminster)} />
          {deptPortrait && (
            <PortraitBox tone="purple" icon="target" title={deptPortrait.title} tagline={deptPortrait.tagline}
              statements={deptPortrait.standards} open={showDepartment} onToggle={() => setShowDepartment(!showDepartment)}
              notice={<PortraitNotice portrait={deptPortrait} />} />
          )}
        </div>
      )}

      {globalSearch && results.length > 0 && (
        <div className="text-sm text-gray-600">
          Found {results.length} standard{results.length !== 1 ? "s" : ""} across all courses
        </div>
      )}

      {results.length > 0 && (
        <div className="space-y-3">
          {results.map(s => (
            <StandardCard key={s.school + s.course + s.id} standard={s} showPath={!!globalSearch}
              portraits={DEPARTMENT_PORTRAITS} canReview={isReviewer && canReviewDept(s.department)}
              onApprove={onApprove} onReject={onReject} />
          ))}
        </div>
      )}

      {results.length === 0 && course && (
        <div className="text-center py-12 text-gray-500">
          <Icon name={term ? "search" : "book"} className="w-12 h-12 mx-auto mb-3 text-gray-400" />
          <p>{term ? "No standards in this course match your search." : "No standards found with the current filters."}</p>
        </div>
      )}
      {results.length === 0 && globalSearch && (
        <div className="text-center py-12 text-gray-500">
          <Icon name="search" className="w-12 h-12 mx-auto mb-3 text-gray-400" />
          <p>No standards found matching “{searchTerm}”.</p>
        </div>
      )}
      {!course && !term && (
        <div className="text-center py-12 text-gray-500">
          <Icon name="book" className="w-12 h-12 mx-auto mb-3 text-gray-400" />
          <p className="font-medium">Select a school, department, and course to view standards.</p>
          <p className="text-sm mt-2 text-gray-400">Or search above to find standards across all courses.</p>
        </div>
      )}
    </div>
  );
}

/* =====================================================================
   PULL FROM BANK (mock)
   ===================================================================== */
function BankModal({ school, department, course, standards, onPick, onClose }) {
  // Each department's snapshot is its own file: standards-bank.js (Mathematics), standards-bank-english.js,
  // standards-bank-history.js, standards-bank-science.js. A bank can set gradeFilter: true to show only the
  // chosen school's grades (rows with grades "7", "8", "6-8" are Middle School; the rest are Upper School).
  const allBanks = [window.STANDARDS_BANK, window.STANDARDS_BANK_ENGLISH, window.STANDARDS_BANK_HISTORY, window.STANDARDS_BANK_SCIENCE].filter(Boolean);
  const bank = allBanks.find(b => b.department === department) || null;
  const [tab, setTab] = useState("honors");
  const [query, setQuery] = useState("");
  const [allGrades, setAllGrades] = useState(false);
  const MS_GRADES = ["6", "7", "8", "6-8"];
  // middleSchoolSeesUpper: Middle School also teaches high-school courses (Algebra 1 and 2), so its searches
  // include grades 9-12 too, listed after the grades 7-8 rows. Upper School never sees grades 7-8 unless "Show all grades" is checked.
  const msSeesAll = !!(bank && bank.middleSchoolSeesUpper) && school === "Middle School";
  const canFilterGrades = !!(bank && bank.gradeFilter) && !msSeesAll && (school === "Middle School" || school === "Upper School");
  const gradeOk = (g) => !canFilterGrades || allGrades || (school === "Middle School" ? MS_GRADES.includes(g) : !MS_GRADES.includes(g));
  const listNames = (names) => names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
  const q = query.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);

  const courseObj = findCourse(school, department, course);
  const own = courseObj ? standards.filter(s => matchesCourse(s, courseObj)) : [];

  // Honors bank: standards written for the Honors level of this course family
  let honorsItems = [];
  let honorsNote = "";
  if (!courseObj) {
    honorsNote = "Choose a school, department, and course first.";
  } else if (!courseObj.family) {
    honorsNote = "This course isn't part of a family with an Honors level, so there is no Honors bank for it.";
  } else if (courseObj.level === "Honors") {
    honorsNote = "This is the Honors level. Honors standards are written first, and the other levels choose from them.";
  } else {
    const honors = COURSES.filter(c => c.school === courseObj.school && c.family === courseObj.family && c.level === "Honors");
    if (honors.length === 0) {
      honorsNote = "This course family has no Honors level, so there is no Honors bank for it.";
    } else {
      honors.forEach(h => {
        standards.filter(s => matchesCourse(s, h)).forEach(s => {
          const already = own.some(o => o.description === s.description);
          honorsItems.push({ source: "honors", code: s.id, ref: h.name + ", " + s.id, text: s.description, category: s.category, already: already });
        });
      });
      if (honorsItems.length === 0) honorsNote = "No standards have been written for the Honors level yet.";
    }
  }
  const honorsShown = honorsItems.filter(i => words.every(w => i.text.toLowerCase().includes(w) || i.category.toLowerCase().includes(w)));

  // Common Core / Missouri snapshot
  const isCluster = (code) => /\.[A-Z]$/.test(code);
  const srcKey = tab === "cc" ? "CC" : "MO";
  let stateItems = [];
  let stateNote = "";
  if (tab !== "honors") {
    if (allBanks.length === 0) stateNote = "The standards files (standards-bank.js, standards-bank-english.js, standards-bank-history.js, standards-bank-science.js) didn't load. Make sure they are uploaded next to index.html.";
    else if (!department) stateNote = "Choose a department first.";
    else if (!bank) stateNote = "Standards are loaded for " + listNames(allBanks.map(b => b.department)) + " so far. Other departments will be added.";
    else if (words.length === 0) stateNote = bank.searchHint || "Search by topic or code, for example “factor”, “quadratic”, “HSA-REI”, or “A2.APR”.";
    else {
      // Math rows include unit-level cluster headings (codes ending in .A, .B...) that are hidden.
      // English rows (Missouri codes end in .A, .B...) are all real standards, so that bank sets hideClusters: false.
      stateItems = bank.rows
        .filter(r => r[0] === srcKey && gradeOk(r[2]) && (bank.hideClusters === false || !isCluster(r[1])))
        .filter(r => words.every(w => r[3].toLowerCase().includes(w) || r[1].toLowerCase().includes(w)))
        .sort((a, b) => msSeesAll ? (MS_GRADES.includes(b[2]) ? 1 : 0) - (MS_GRADES.includes(a[2]) ? 1 : 0) : 0)
        .map(r => ({ source: srcKey === "CC" ? "Common Core" : "Missouri Learning Standards", code: r[1], ref: r[1], text: r[3] }));
      if (stateItems.length === 0) stateNote = "No standards match that search.";
    }
  }
  const shownState = stateItems.slice(0, 40);

  // Only show a source tab if this department's bank has that source (History and Science are Common Core only).
  const hasSrc = (k) => !bank || !bank.sources || !!bank.sources[k];
  const labelFor = (k, fallback) => (bank && bank.tabLabels && bank.tabLabels[k]) || fallback;
  const tabs = [["honors", "Honors bank"]];
  if (hasSrc("CC")) tabs.push(["cc", labelFor("CC", "Common Core")]);
  if (hasSrc("MO")) tabs.push(["mo", labelFor("MO", "Missouri Learning Standards")]);

  return (
    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-lg max-w-3xl w-full max-h-[85vh] overflow-hidden flex flex-col" role="dialog" aria-label="Standard bank">
        <div className="p-6 border-b flex items-center justify-between">
          <h3 className="text-xl font-bold text-gray-800">Standard Bank</h3>
          <button onClick={onClose} aria-label="Close" className="text-gray-500 hover:text-gray-700 text-2xl leading-none">×</button>
        </div>
        <div className="p-6 space-y-4 overflow-y-auto flex-1">
          <div className="flex flex-wrap gap-2">
            {tabs.map(t => <FilterPill key={t[0]} active={tab === t[0]} onClick={() => setTab(t[0])}>{t[1]}</FilterPill>)}
          </div>
          <input type="text" value={query} onChange={e => setQuery(e.target.value)} aria-label="Search the bank"
            placeholder="Search the bank..." className="w-full px-4 py-2 border border-gray-300 rounded-lg" />

          {tab === "honors" && (
            <div className="space-y-2">
              {honorsNote && <p className="text-sm text-gray-600 bg-gray-50 border border-gray-200 rounded px-3 py-2">{honorsNote}</p>}
              {!honorsNote && honorsShown.length === 0 && <p className="text-sm text-gray-500 py-4 text-center">No Honors standards match.</p>}
              {honorsShown.map((i, idx) => (
                <button key={idx} onClick={() => onPick(i)} disabled={i.already}
                  className="w-full text-left p-3 bg-white rounded border border-gray-200 hover:bg-blue-50 hover:border-blue-300 disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed">
                  <div className="text-xs text-gray-500 mb-1">{i.ref}{i.already ? " (this course already has it)" : ""}</div>
                  <div className="text-sm text-gray-800">{i.text}</div>
                </button>
              ))}
            </div>
          )}

          {tab !== "honors" && (
            <div className="space-y-2">
              {bank && bank.scopeNote && <p className="text-xs text-gray-500">{bank.scopeNote}</p>}
              {msSeesAll && <p className="text-xs text-gray-500">Showing grades 7-8 first, then grades 9-12, because Middle School offers Algebra 1 and Algebra 2.</p>}
              {canFilterGrades && (
                <label className="flex items-center gap-2 text-xs text-gray-600">
                  <input type="checkbox" checked={allGrades} onChange={e => setAllGrades(e.target.checked)} />
                  <span>{allGrades ? "Showing all grades." : "Showing " + school + " standards only."} Show all grades</span>
                </label>
              )}
              {stateNote && <p className="text-sm text-gray-600 bg-gray-50 border border-gray-200 rounded px-3 py-2">{stateNote}</p>}
              {shownState.map((i, idx) => (
                <button key={idx} onClick={() => onPick(i)}
                  className="w-full text-left p-3 bg-white rounded border border-gray-200 hover:bg-blue-50 hover:border-blue-300">
                  <div className="text-xs text-gray-500 mb-1">{i.ref}</div>
                  <div className="text-sm text-gray-800">{i.text}</div>
                </button>
              ))}
              {stateItems.length > 40 && <p className="text-xs text-gray-500">Showing the first 40 of {stateItems.length}. Add another word to narrow the search.</p>}
              {shownState.length > 0 && <p className="text-xs text-gray-500">Choosing a standard rewords it to begin with “Students will...” so you can edit it.</p>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   CREATE STANDARD VIEW
   ===================================================================== */
const EMPTY_FORM = { school: "", department: "", course: "", category: "", description: "", unit: "" };

function FormField({ label, hint, children }) {
  return (
    <div>
      <label className="block text-sm font-medium text-gray-700 mb-2">
        {label} {hint && <span className="text-gray-500 text-xs font-normal">{hint}</span>}
      </label>
      {children}
    </div>
  );
}

function CreateStandardView({ standards, units, onSave, onAddUnit, currentUser }) {
  const [form, setForm] = useState(EMPTY_FORM);
  const [pogs, setPogs] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [analyzedText, setAnalyzedText] = useState("");
  const [analyzing, setAnalyzing] = useState(false);
  const [showBank, setShowBank] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [rewording, setRewording] = useState(false);
  const [bankRef, setBankRef] = useState("");

  const set = (patch) => setForm(prev => ({ ...prev, ...patch }));
  const portrait = DEPARTMENT_PORTRAITS[form.department];
  const deptStatements = portrait ? portrait.standards : [];
  const courses = (form.school && form.department && COURSE_DATA[form.school][form.department]) || [];
  const words = countWords(form.description);
  const standardId = generateStandardId(form.course, standards.map(s => s.id));
  const stale = analysis && analyzedText !== form.description;
  // Unit (optional): the course's existing units, plus a unit typed here that doesn't exist yet (it is created on save).
  const unitKey = courseKey(form.school, form.department, form.course);
  const courseUnits = (units && units[unitKey]) || [];
  const unitChoices = form.unit && !courseUnits.includes(form.unit) ? courseUnits.concat([form.unit]) : courseUnits;
  const unitSuggestion = form.course
    ? suggestUnit({ id: "", category: form.category, description: form.description },
        standards.filter(s => s.school === form.school && s.department === form.department && s.course === form.course), courseUnits)
    : null;

  const pickFromBank = async (item) => {
    setShowBank(false);
    setError(""); setNotice("");
    if (item.source === "honors") {
      set({ description: item.text });
      setBankRef("Honors bank: " + item.ref);
      return;
    }
    setBankRef(item.source + ": " + item.ref);
    if (!WORKER_URL) {
      set({ description: item.text });
      setError("The rewording service isn't connected, so the standard was added as written. Edit it to begin with “Students will...”");
      return;
    }
    setRewording(true);
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "reword", description: item.text, department: form.department, course: form.course })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      set({ description: data.text });
    } catch (e) {
      set({ description: item.text });
      setError("The rewording didn't work (" + e.message + "), so the standard was added as written. Edit it to begin with “Students will...”");
    } finally {
      setRewording(false);
    }
  };

  const togglePog = (code) => {
    if (pogs.includes(code)) setPogs(pogs.filter(c => c !== code));
    else if (pogs.length < 3) setPogs([...pogs, code]);
  };

  const analyze = async () => {
    setError("");
    if (form.description.trim().length < 10) { setError("Enter the full standard description before analyzing."); return; }
    if (!WORKER_URL) {
      setError("The AI analysis service isn't connected yet. Set WORKER_URL at the top of the script to your Cloudflare Worker address.");
      return;
    }
    setAnalyzing(true);
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description: form.description, department: form.department, course: form.course })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      setAnalysis(data);
      setAnalyzedText(form.description);
    } catch (e) {
      setError("The analysis didn't work: " + e.message + ". Try again in a moment.");
    } finally {
      setAnalyzing(false);
    }
  };

  const submit = (asDraft) => {
    setError(""); setNotice("");
    if (!form.school || !form.department || !form.course || !form.category.trim() || !form.description.trim()) {
      setError("Fill in school, department, course, category, and description."); return;
    }
    if (!/^students will\b/i.test(form.description.trim())) {
      setError("The description must begin with “Students will...”"); return;
    }
    if (pogs.length < 1) { setError("Choose at least one Department Portrait statement."); return; }
    if (pogs.length > 3) { setError("Choose no more than three Department Portrait statements."); return; }

    const placement = analysis ? { complexity: analysis.complexity, autonomy: analysis.autonomy } : { complexity: 0, autonomy: 0 };
    if (form.unit) onAddUnit(unitKey, form.unit);
    onSave({
      id: standardId, school: form.school, department: form.department, course: form.course,
      category: form.category.trim(), description: form.description.trim(),
      placement, status: "draft", submitted: !asDraft,
      createdBy: currentUser, createdDate: new Date().toISOString().slice(0, 10),
      alignsTo: pogs, assessments: analysis ? analysis.assessments : [], unit: form.unit || ""
    });
    setNotice(asDraft
      ? "Saved as a draft: " + standardId + ". It stays in this browser tab only during the demo."
      : "Submitted for approval: " + standardId + ". In the full version your department chair would get an email with a review link.");
    if (form.unit) setNotice(prev => prev + " Placed in " + form.unit + ".");
    setForm(EMPTY_FORM); setPogs([]); setAnalysis(null); setAnalyzedText(""); setBankRef("");
  };

  return (
    <div className="max-w-4xl mx-auto">
      <div className="bg-white rounded-lg shadow-lg p-8">
        <div className="flex items-center justify-between mb-6 gap-4 flex-wrap">
          <h2 className="text-2xl font-bold text-gray-800">Create New Standard</h2>
          <button onClick={() => setShowBank(true)}
            className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center gap-2">
            <Icon name="database" className="w-4 h-4" /> Pull from Bank
          </button>
        </div>

        <p className="text-sm text-gray-500 mb-6 -mt-3">
          A new standard stays a draft until your department chair approves it. Save it as a draft to keep working, or submit it for approval.
        </p>

        {notice && <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg text-green-800 font-medium">✓ {notice}</div>}
        {error && <div role="alert" className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-800 text-sm">{error}</div>}

        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <FormField label="School *">
              <select value={form.school} onChange={e => { set({ school: e.target.value, department: "", course: "", unit: "" }); setPogs([]); }}
                className="w-full px-4 py-2 border border-gray-300 rounded-lg">
                <option value="">Select School</option>
                {Object.keys(COURSE_DATA).map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </FormField>
            <FormField label="Department *">
              <select value={form.department} disabled={!form.school}
                onChange={e => { set({ department: e.target.value, course: "", unit: "" }); setPogs([]); }}
                className="w-full px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
                <option value="">Select Department</option>
                {form.school && Object.keys(COURSE_DATA[form.school]).map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </FormField>
            <FormField label="Course *">
              <select value={form.course} disabled={!form.department || courses.length === 0}
                onChange={e => set({ course: e.target.value, unit: "" })}
                className="w-full px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
                <option value="">{form.department && courses.length === 0 ? "No courses listed" : "Select Course"}</option>
                {courses.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </FormField>
          </div>

          {form.course && (
            <div className="p-3 bg-blue-50 border border-blue-200 rounded-lg text-sm text-blue-800">
              <strong>Standard ID (auto-generated):</strong> {standardId}
            </div>
          )}

          <FormField label="Category *" hint={"(" + form.category.length + "/30 characters)"}>
            <input type="text" value={form.category} maxLength={30} onChange={e => set({ category: e.target.value })}
              placeholder="e.g., Linear Equations" className="w-full px-4 py-2 border border-gray-300 rounded-lg" />
          </FormField>

          <FormField label="Description *" hint={"(" + words + " words, aim for about 20)"}>
            <textarea value={form.description} onChange={e => set({ description: e.target.value })}
              placeholder="Students will..." rows={4} className="w-full px-4 py-2 border border-gray-300 rounded-lg" />
            <p className="text-xs text-gray-500 mt-1">Must begin with “Students will...”</p>
            {rewording && <p className="text-xs text-indigo-700 mt-1">Rewording the standard...</p>}
            {bankRef && !rewording && <p className="text-xs text-gray-500 mt-1">Based on {bankRef}</p>}
          </FormField>

          {form.course && (

// ---------- Unit suggestions and the unit picker ----------
const UNIT_STOPWORDS = new Set(("students will student the and with for that from into their each using use used solve solving problem problems " +
  "real world understand apply analyze analyse describe explain given various include including also than they them this these those are can " +
  "one two other such about between within through over under form forms different based any all how why what when which where was were has have").split(" "));
const unitStem = (w) => w.replace(/(ing|ed|es|s)$/, "");
function unitWords(text) {
  return (text || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
    .filter(w => w.length > 2 && !UNIT_STOPWORDS.has(w)).map(unitStem).filter(w => w.length > 2);
}
// Suggests one of the course's existing units for a standard, or null. Two signals:
// (1) other standards with the same category already sit in a unit; (2) wording overlaps the unit name or its standards.
function suggestUnit(item, courseStandards, unitList) {
  if (!unitList || unitList.length === 0) return null;
  const cat = (item.category || "").trim().toLowerCase();
  if (cat) {
    const counts = {};
    courseStandards.forEach(o => {
      if (o.id !== item.id && unitList.includes(o.unit) && (o.category || "").trim().toLowerCase() === cat) counts[o.unit] = (counts[o.unit] || 0) + 1;
    });
    const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (ranked.length === 1 || (ranked.length > 1 && counts[ranked[0]] > counts[ranked[1]]))
      return { unit: ranked[0], reason: "other “" + item.category.trim() + "” standards are in this unit" };
  }
  const mine = new Set(unitWords((item.category || "") + " " + (item.description || "")));
  if (mine.size === 0) return null;
  const scored = unitList.map(u => {
    const nameWords = unitWords(u.replace(/^\s*unit\s*\d+\s*[:\-–.]?\s*/i, ""));
    let score = 0, nameHit = false;
    nameWords.forEach(w => { if (mine.has(w)) { score += 3; nameHit = true; } });
    courseStandards.forEach(o => {
      if (o.unit === u && o.id !== item.id) unitWords((o.category || "") + " " + (o.description || "")).forEach(w => { if (w.length > 4 && mine.has(w)) score += 1; });
    });
    return { unit: u, score: score, nameHit: nameHit };
  }).sort((a, b) => b.score - a.score);
  const top = scored[0], next = scored[1];
  if (top.score < 3 || (next && next.score === top.score)) return null;
  return { unit: top.unit, reason: top.nameHit ? "matches the unit name" : "matches standards already in this unit" };
}

// A unit dropdown that can also create a unit on the spot ("+ New unit…") and offers a one-click suggestion.
function UnitPicker({ value, unitList, suggestion, idPrefix, emptyLabel, onChoose, onCreate }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const cleanName = name.trim();
  const finish = () => { if (!cleanName) return; onCreate(cleanName); setName(""); setAdding(false); };
  const cancel = () => { setName(""); setAdding(false); };
  return (
    <div className="space-y-1">
      <div className="flex items-center gap-2 flex-wrap">
        <select id={idPrefix} value={adding ? "__new__" : value} aria-label="Unit"
          onChange={e => { if (e.target.value === "__new__") setAdding(true); else { setAdding(false); onChoose(e.target.value); } }}
          className="px-2 py-1 border border-gray-300 rounded text-sm">
          <option value="">{emptyLabel || "Unassigned"}</option>
          {unitList.map(u => <option key={u} value={u}>{u}</option>)}
          <option value="__new__">+ New unit…</option>
        </select>
        {suggestion && !value && !adding && (
          <span className="flex items-center gap-1 flex-wrap text-xs">
            <span className="text-gray-500">Suggested:</span>
            <button type="button" onClick={() => onChoose(suggestion.unit)}
              className="px-2 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-300 hover:bg-green-200">{suggestion.unit}</button>
            <span className="text-gray-400">({suggestion.reason})</span>
          </span>
        )}
      </div>
      {adding && (
        <div className="flex items-center gap-2 flex-wrap">
          <input type="text" autoFocus value={name} onChange={e => setName(e.target.value)} aria-label="New unit name"
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); finish(); } else if (e.key === "Escape") cancel(); }}
            placeholder="e.g., Unit 3: Systems of Equations"
            className="flex-1 min-w-[14rem] px-2 py-1 border border-gray-300 rounded text-sm" />
          <button type="button" onClick={finish} disabled={!cleanName}
            className="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed">Create and use</button>
          <button type="button" onClick={cancel} className="px-3 py-1 text-sm text-gray-600 hover:text-gray-900">Cancel</button>
        </div>
      )}
    </div>
  );
}

function SameGradeSection({ course, courseStandards, standards }) {
  if (course.school !== US) {
    return (
      <section>
        <SectionTitle title="Horizontal alignment: same grade" />
        <Note>Middle School grade levels aren't set yet, so this view is available for Upper School courses only.</Note>
      </section>
    );
  }
  if (!course.core) {
    return (
      <section>
        <SectionTitle title="Horizontal alignment: same grade" />
        <Note>
          {course.byLevel
            ? "World Language courses are placed by level, not by grade, so there is no same-grade comparison."
            : "This course has no single typical grade (it is open to several grades or isn't on the registration forms), so there is no same-grade comparison."}
        </Note>
      </section>
    );
  }

  const peers = COURSES.filter(c => c.school === US && c.core === course.core);
  const map = {};
  peers.forEach(c => {
    const key = c.family ? "fam:" + c.family : "course:" + c.name;
    if (!map[key]) map[key] = { key: key, label: c.family || c.name, depts: [], courses: [] };
    if (!map[key].depts.includes(c.department)) map[key].depts.push(c.department);
    map[key].courses.push(c);
  });
  const myKey = course.family ? "fam:" + course.family : "course:" + course.name;

  const ownCodes = [];
  courseStandards.forEach(s => s.alignsTo.forEach(code => {
    const w = westminsterCode(code);
    if (w && !ownCodes.includes(w)) ownCodes.push(w);
  }));

  const groups = Object.values(map).map(g => {
    const gs = standards.filter(s => g.courses.some(c => matchesCourse(s, c)));
    const codes = [];
    let unmapped = 0;
    gs.forEach(s => s.alignsTo.forEach(code => {
      const w = westminsterCode(code);
      if (w) { if (!codes.includes(w)) codes.push(w); } else { unmapped++; }
    }));
    codes.sort();
    return Object.assign({}, g, { count: gs.length, codes: codes, unmapped: unmapped });
  }).sort((a, b) => {
    if (a.key === myKey) return -1;
    if (b.key === myKey) return 1;
    const d = DEPT_ORDER.indexOf(a.depts[0]) - DEPT_ORDER.indexOf(b.depts[0]);
    return d !== 0 ? d : a.label.localeCompare(b.label);
  });

  const sharedWithOthers = [];
  groups.filter(g => g.key !== myKey).forEach(g => g.codes.forEach(code => {
    if (ownCodes.includes(code) && !sharedWithOthers.includes(code)) sharedWithOthers.push(code);
  }));
  sharedWithOthers.sort();

  return (
    <section>
      <SectionTitle title={"Horizontal alignment: grade " + course.core + " across departments"}
        subtitle={"Courses that are the typical placement for grade " + course.core + ", and the Westminster Portrait statements their standards connect to."} />
      <p className="text-sm text-gray-700 mb-3">
        {ownCodes.length === 0
          ? "This course has no standards connected to a Westminster statement yet."
          : sharedWithOthers.length === 0
            ? "No other grade " + course.core + " course shares a Westminster statement with this course yet."
            : "This course shares " + sharedWithOthers.length + " Westminster statement" + (sharedWithOthers.length !== 1 ? "s" : "") + " with other grade " + course.core + " courses: " + sharedWithOthers.join(", ") + "."}
      </p>
      <div className="overflow-x-auto">
        <table className="w-full text-sm border border-gray-300">
          <thead>
            <tr className="bg-gray-100 text-left">
              <th className="px-3 py-2 border-b border-gray-300">Course</th>
              <th className="px-3 py-2 border-b border-gray-300">Department</th>
              <th className="px-3 py-2 border-b border-gray-300 text-center">Standards</th>
              <th className="px-3 py-2 border-b border-gray-300">Westminster statements touched</th>
            </tr>
          </thead>
          <tbody>
            {groups.map(g => {
              const mine = g.key === myKey;
              return (
                <tr key={g.key} className={"border-b border-gray-200 avoid-break " + (mine ? "bg-blue-50" : "")}>
                  <td className="px-3 py-2 text-gray-800">
                    <span className={mine ? "font-semibold" : ""}>{g.label}</span>
                    {mine && <span className="text-xs text-blue-700 ml-2">(this course)</span>}
                  </td>
                  <td className="px-3 py-2 text-gray-600">{g.depts.join(" / ")}</td>
                  <td className="px-3 py-2 text-center">{g.count}</td>
                  <td className="px-3 py-2">
                    {g.count === 0
                      ? <span className="italic text-gray-400">No standards entered yet</span>
                      : <div className="flex flex-wrap gap-1 items-center">
                          {g.codes.map(code => <CodeChip key={code} code={code} tone={!mine && ownCodes.includes(code) ? "shared" : "plain"} />)}
                          {g.unmapped > 0 && <span className="text-xs italic text-gray-500">+ {g.unmapped} awaiting a Westminster connection</span>}
                        </div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="text-xs text-gray-500 mt-2">
        Blue chips are Westminster statements that this course also connects to. Department statements are matched to Westminster statements by number; English and Fine Arts need a connection set by their chairs first.
      </p>
    </section>
  );
}

function LevelsSection({ course, standards }) {
  const siblings = course.family
    ? COURSES.filter(c => c.school === course.school && c.family === course.family)
        .sort((a, b) => LEVEL_ORDER.indexOf(a.level) - LEVEL_ORDER.indexOf(b.level))
    : [];
  if (siblings.length < 2) {
    return (
      <section>
        <SectionTitle title="Horizontal alignment: levels of this course" />
        <Note>This course doesn't have other levels (such as Fundamentals, Traditional, or Honors) in the course list.</Note>
      </section>
    );
  }
  const perLevel = siblings.map(c => standards.filter(s => matchesCourse(s, c)));
  const rows = [];
  perLevel.forEach((list, idx) => {
    list.forEach(s => {
      let row = rows.find(r => r.description === s.description);
      if (!row) {
        row = { description: s.description, category: s.category, present: {} };
        rows.push(row);
      }
      row.present[idx] = s;
    });
  });
  rows.sort((a, b) => Object.keys(b.present).length - Object.keys(a.present).length);

  return (
    <section className="avoid-break">
      <SectionTitle title={"Horizontal alignment: levels of " + course.family}
        subtitle="Which standards each level teaches. A dash means that level leaves the standard out." />
      {rows.length === 0 ? (
        <Note>No standards are entered for any level of this course yet.</Note>
      ) : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm border border-gray-300">
            <thead>
              <tr className="bg-gray-100">
                <th className="text-left px-3 py-2 border-b border-gray-300">Standard</th>
                {siblings.map(c => (
                  <th key={c.name} className={"px-3 py-2 border-b border-gray-300 text-center " + (c.name === course.name ? "bg-blue-100 text-blue-900" : "")}>
                    {c.level}{c.department !== course.department ? " (" + c.department + ")" : ""}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-200 avoid-break">
                  <td className="px-3 py-2 text-gray-800">
                    <span className="text-gray-500">{r.category}: </span>{r.description}
                  </td>
                  {siblings.map((c, idx) => {
                    const s = r.present[idx];
                    return (
                      <td key={c.name} className={"px-3 py-2 text-center " + (c.name === course.name ? "bg-blue-50" : "")}>
                        {s
                          ? <span className="font-semibold text-gray-900">{s.status === "draft" ? "draft" : "✓"}</span>
                          : <span className="text-gray-400">–</span>}
                      </td>
                    );
                  })}
                </tr>
              ))}
              <tr className="bg-gray-50">
                <td className="px-3 py-2 font-medium text-gray-700">Standards taught</td>
                {perLevel.map((list, idx) => (
                  <td key={idx} className="px-3 py-2 text-center font-medium text-gray-700">{list.length}</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
      )}
      <p className="text-xs text-gray-500 mt-2">
        Standards are matched when their wording is identical. In the full version the levels will choose from one shared bank, so the match will be exact.
      </p>
    </section>
  );
}

function OutlineReport({ course, portrait, standards, unitList, onAddUnit, onAssignUnit }) {
  const courseStandards = standards.filter(s => matchesCourse(s, course));
  const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  return (
    <div className="space-y-8">
      <div className="flex items-start justify-between gap-4 flex-wrap">
        <div>
          <p className="print-only text-sm text-gray-600">Westminster Christian Academy · Course Outline</p>
          <h2 className="text-3xl font-bold text-gray-900">{course.name}</h2>
          <p className="text-gray-700 mt-1">{course.school}, {course.department}</p>
          <p className="text-sm text-gray-600">
            {gradeText(course)}
            {course.family && course.level ? ". Level: " + course.level : ""}
          </p>
          <p className="print-only text-xs text-gray-500 mt-1">Printed {today}</p>
        </div>
        <div className="no-print text-right">
          <button onClick={() => window.print()}
            className="px-5 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
            Export to PDF
          </button>
          <p className="text-xs text-gray-500 mt-2 max-w-xs">
            In the print window, set the destination to “Save as PDF”.
          </p>
        </div>
      </div>

      <div className="print-only">
        <PrintPortrait title={WESTMINSTER_PORTRAIT.title} tagline={WESTMINSTER_PORTRAIT.tagline} statements={WESTMINSTER_PORTRAIT.traits} />
        {portrait && (
          <PrintPortrait title={portrait.title} tagline={portrait.tagline} statements={portrait.standards}
            notice={<PortraitNotice portrait={portrait} />} />
        )}
      </div>

      <UnitsSection courseStandards={courseStandards} unitList={unitList} onAddUnit={onAddUnit} onAssignUnit={onAssignUnit} />

      <div className="print-break space-y-8">
        <VerticalSection portrait={portrait} courseStandards={courseStandards} courseName={course.name} />
        <DeptGradeSection course={course} portrait={portrait} standards={standards} />
        <SameGradeSection course={course} courseStandards={courseStandards} standards={standards} />
        <LevelsSection course={course} standards={standards} />
      </div>
    </div>
  );
}

function OutlineView({ standards, units, onAddUnit, onAssignUnit }) {
  const [school, setSchool] = useState("");
  const [department, setDepartment] = useState("");
  const [courseName, setCourseName] = useState("");
  const [showWestminster, setShowWestminster] = useState(false);
  const [showDepartment, setShowDepartment] = useState(false);

  const courses = (school && department && COURSE_DATA[school][department]) || [];
  const course = findCourse(school, department, courseName);
  const portrait = DEPARTMENT_PORTRAITS[department];
  const key = course ? courseKey(course.school, course.department, course.name) : "";

  return (
    <div className="space-y-6">
      <div className="no-print space-y-6">
        <p className="text-sm text-gray-500">
          Choose a school and department, then a course. The outline groups the course's standards into units and shows how they line up with the portraits and with other courses.
        </p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <select value={school} aria-label="School"
            onChange={e => { setSchool(e.target.value); setDepartment(""); setCourseName(""); }}
            className="px-4 py-2 border border-gray-300 rounded-lg">
            <option value="">Select School</option>
            {SCHOOLS.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={department} aria-label="Department" disabled={!school}
            onChange={e => { setDepartment(e.target.value); setCourseName(""); setShowDepartment(false); }}
            className="px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
            <option value="">Select Department</option>
            {school && Object.keys(COURSE_DATA[school]).map(d => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>

        {department && (
          <div className="space-y-4">
            <PortraitBox tone="blue" icon="award" title={WESTMINSTER_PORTRAIT.title} tagline={WESTMINSTER_PORTRAIT.tagline}
              statements={WESTMINSTER_PORTRAIT.traits} open={showWestminster} onToggle={() => setShowWestminster(!showWestminster)} />
            {portrait && (
              <PortraitBox tone="purple" icon="target" title={portrait.title} tagline={portrait.tagline}
                statements={portrait.standards} open={showDepartment} onToggle={() => setShowDepartment(!showDepartment)}
                notice={<PortraitNotice portrait={portrait} />} />
            )}
            <select value={courseName} aria-label="Course" disabled={courses.length === 0}
              onChange={e => setCourseName(e.target.value)}
              className="w-full md:w-1/2 px-4 py-2 border border-gray-300 rounded-lg disabled:bg-gray-100">
              <option value="">{courses.length === 0 ? "No courses listed" : "Select Course"}</option>
              {courses.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        )}

        {!course && (
          <div className="text-center py-12 text-gray-500">
            <Icon name="target" className="w-12 h-12 mx-auto mb-3 text-gray-400" />
            <p className="font-medium">Select a course to see its outline.</p>
          </div>
        )}
      </div>

      {course && (
        <OutlineReport key={key} course={course} portrait={portrait} standards={standards}
          unitList={units[key] || []} onAddUnit={(name) => onAddUnit(key, name)} onAssignUnit={onAssignUnit} />
      )}
    </div>
  );
}


/* =====================================================================
   APP
   ===================================================================== */
function NavButton({ active, onClick, icon, children }) {
  return (
    <button onClick={onClick}
      className={"py-4 px-2 border-b-2 font-medium transition-colors flex items-center gap-2 " +
        (active ? "border-blue-600 text-blue-600" : "border-transparent text-gray-600 hover:text-gray-800")}>
      <Icon name={icon} className="w-4 h-4" /> {children}
    </button>
  );
}

function App() {
  const [view, setView] = useState("browse");
  const [userRole, setUserRole] = useState("teacher");
  const [standards, setStandards] = useState(SAMPLE_STANDARDS);
  const [units, setUnits] = useState({
    [courseKey("Middle School", "Mathematics", "Algebra 1")]: ["Unit 1: Linear Equations", "Unit 2: Factoring and Quadratics"]
  });

  // Browse state lives here so it survives switching tabs
  const [school, setSchool] = useState("");
  const [department, setDepartment] = useState("");
  const [course, setCourse] = useState("");
  const [searchTerm, setSearchTerm] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const addStandard = (s) => setStandards(prev => [...prev, s]);
  const addUnit = (key, name) => {
    const n = name.trim();
    if (!n) return;
    setUnits(prev => {
      const current = prev[key] || [];
      if (current.includes(n)) return prev;
      return Object.assign({}, prev, { [key]: current.concat([n]) });
    });
  };
  const assignUnit = (id, unit) => setStandards(prev => prev.map(s => s.id === id ? Object.assign({}, s, { unit: unit }) : s));
  const approve = (id) => setStandards(prev => prev.map(s => s.id === id ? { ...s, status: "approved" } : s));
  const reject = (id, comment) => {
    console.log("Rejected", id, "with comment:", comment);
    setStandards(prev => prev.filter(s => s.id !== id));
  };

  const roles = [
    ["teacher", "Teacher"],
    ["chair", "Department Chair (" + DEMO_CHAIR_DEPARTMENT + ")"],
    ["principal", "Principal"],
    ["superadmin", "SuperAdmin"]
  ];

  return (
    <div className="min-h-screen bg-gray-50">
      <header className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-lg no-print">
        <div className="container mx-auto px-4 py-6">
          <div className="flex items-center justify-between gap-4 flex-wrap">
            <div>
              <h1 className="text-3xl font-bold">Westminster Standards Platform</h1>
              <p className="text-blue-100 mt-1">Building academic excellence through clear, rigorous standards</p>
              <p className="text-blue-200 text-sm mt-1">Phase 1 demo: sample data, nothing is saved</p>
            </div>
            <div className="flex items-center gap-2">
              <Icon name="users" className="w-5 h-5" />
              <div className="text-right">
                <div className="text-sm font-medium">{DEMO_USER}</div>
                <div className="text-xs text-blue-200 capitalize">{userRole}</div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div className="bg-yellow-50 border-b border-yellow-200 no-print">
        <div className="container mx-auto px-4 py-2">
          <div className="flex items-center gap-x-4 gap-y-1 text-sm flex-wrap">
            <span className="text-yellow-800 font-medium">Demo mode, choose a role:</span>
            {roles.map(([value, label]) => (
              <label key={value} className="flex items-center gap-2">
                <input type="radio" name="role" checked={userRole === value} onChange={() => setUserRole(value)} />
                {label}
              </label>
            ))}
          </div>
        </div>
      </div>

      <nav className="bg-white shadow-md no-print">
        <div className="container mx-auto px-4">
          <div className="flex space-x-8 overflow-x-auto">
            <NavButton active={view === "browse"} onClick={() => setView("browse")} icon="book">Browse Standards</NavButton>
            <NavButton active={view === "create"} onClick={() => setView("create")} icon="plus">Create Standard</NavButton>
            <NavButton active={view === "outline"} onClick={() => setView("outline")} icon="target">Course Outlines</NavButton>
          </div>
        </div>
      </nav>

      <main className="container mx-auto px-4 py-8">
        {view === "browse" && (
          <BrowseView standards={standards} onApprove={approve} onReject={reject}
            userRole={userRole} currentUser={DEMO_USER} chairDepartment={DEMO_CHAIR_DEPARTMENT}
            school={school} setSchool={setSchool} department={department} setDepartment={setDepartment}
            course={course} setCourse={setCourse} searchTerm={searchTerm} setSearchTerm={setSearchTerm}
            statusFilter={statusFilter} setStatusFilter={setStatusFilter} />
        )}
        {view === "create" && <CreateStandardView standards={standards} units={units} onSave={addStandard} onAddUnit={addUnit} currentUser={DEMO_USER} />}
        {view === "outline" && <OutlineView standards={standards} units={units} onAddUnit={addUnit} onAssignUnit={assignUnit} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
